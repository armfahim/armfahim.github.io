<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · A. R. M. Fahim</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12; --surface: #161a23; --border: #262c3a;
      --text: #e7ebf3; --dim: #9aa4b8; --brand: #6366f1; --accent: #22d3ee;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      overflow: hidden;
    }
    .wrap { position: relative; z-index: 1; max-width: 560px; }
    .glow {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(600px 400px at 25% 25%, rgba(99,102,241,.18), transparent 60%),
        radial-gradient(500px 500px at 80% 80%, rgba(34,211,238,.12), transparent 60%);
    }
    .brand { font-family: 'JetBrains Mono', monospace; color: var(--brand); font-weight: 600; font-size: 1.1rem; margin-bottom: 28px; display: inline-block; }
    .code {
      font-size: clamp(6rem, 22vw, 11rem); font-weight: 800; line-height: 1; letter-spacing: -4px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); font-weight: 700; margin: 10px 0 12px; }
    p { color: var(--dim); font-size: 1.05rem; margin-bottom: 30px; }
    .btn {
      display: inline-flex; align-items: center; gap: 9px; padding: 13px 26px; border-radius: 12px;
      font-weight: 600; color: #fff; text-decoration: none;
      background: linear-gradient(135deg, var(--brand), #8b5cf6);
      box-shadow: 0 12px 26px -10px var(--brand); transition: transform .2s ease;
    }
    .btn:hover { transform: translateY(-3px); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <span class="brand">&lt;/&gt; A. R. M. Fahim</span>
    <div class="code">404</div>
    <h1>This page took a wrong turn</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
    <a class="btn" href="/">← Back to Home</a>
  </div>
</body>
</html>
